stages:
  - build
  - deploy

variables:
  NODE_ENV: production

cache:
  paths:
    - node_modules/

build_app:
  stage: build
  image: node:18
  tags:
    - docker        # <--- ДОБАВИЛ
  script:
    - npm ci
    - npm run build
    - CI=false npm run build   # <-- вот это
  artifacts:
    paths:
      - build/
    expire_in: 1 week
  only:
    - main

deploy_production:
  stage: deploy
  image: alpine:latest
  tags:
    - docker        # <--- И ТУТ
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

  script:
    - rsync -avz --delete build/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

  environment:
    name: production
    url: http://your-domain.com
  only:
    - main
  when: manual