stages:
  - build
  - deploy

variables:
  NODE_ENV: production

cache:
  paths:
    - node_modules/

build_app:
  stage: build
  image: node:18
  tags:
    - docker
  script:
    - npm ci
    - CI=false npm run build
  artifacts:
    paths:
      - build/
    expire_in: 1 week
  only:
    - main

deploy_production:
  stage: deploy
  image: alpine:latest
  tags:
    - docker
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
  script:
    # опционально оставить проверку:
    - ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "echo 'DEPLOY PATH:' && ls -la '$DEPLOY_PATH'"
    # сам деплой
    - rsync -avz build/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
  environment:
    name: production
    url: http://your-domain.com
  only:
    - main
  when: manual